# ──────────────────────────────────────────────────────────────────────────
# yourTermux - Termux properties
# Author: JubairSenseiDev
#
# Customized for new Termux users — adds extended key row with arrows,
# Ctrl/Alt modifiers, brackets/braces for coding, and helpful shortcuts.
#
# After editing, run:  termux-reload-settings
# ──────────────────────────────────────────────────────────────────────────

# ── Extra keys row (the row above the soft keyboard) ──────────────────────
# Row 1: function keys, modifiers, navigation
# Row 2: brackets/braces, symbols, arrows  (great for coding)
# Row 3: shortcuts every new Termux user needs
extra-keys = [ \
    ['F1','F2','F3','ESC','CTRL','ALT','TAB','HOME','UP','END'], \
    ['F4','F5','F6',{key: '-', popup: '|'},{key: '<', popup: '>'},'(',')','LEFT','DOWN','RIGHT'], \
    ['F7','F8','F9','/','\\','$','{','}','[',']'] \
]

# Allow other apps (e.g. share-to-termux, file pickers) to talk to Termux
allow-external-apps = true

# ── Session shortcuts (Volume Down + key) ─────────────────────────────────
# New session
shortcut.create-session = ctrl + t

# Next / previous session
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1

# Rename current session
shortcut.rename-session = ctrl + u

# ── Scroll & selection shortcuts ──────────────────────────────────────────
# Scroll up / down a page
shortcut.scroll-up = ctrl + b
shortcut.scroll-down = ctrl + f

# ── Misc terminal behavior ────────────────────────────────────────────────
# Cursor blink rate (ms). 0 = steady, 600 = moderate blink.
terminal-cursor-blink-rate = 600

# Back key behavior: escape (default for power users) vs back
# backtrack-key = escape

# Bell character: ignore (silent) or beep (sound) or vibrate
# bell-character = ignore

# ── Optional fullscreen (uncomment to enable) ────────────────────────────
# fullscreen = true
# use-fullscreen-workaround = true

# ── Font / colors (managed by chfont and chcolor commands) ───────────────
# font-path = ~/.termux/font.ttf
# color-path = ~/.termux/colors.properties
